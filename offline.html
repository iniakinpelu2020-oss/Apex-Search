<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d17" />
  <meta name="color-scheme" content="dark" />
  <title>Offline - Apex Search</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eef1ff;
      background: radial-gradient(120% 90% at 50% -20%, #1a1f3d 0%, #080a12 58%) no-repeat, #080a12;
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 34ch; }
    .mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      color: #7c8cff;
      border: 1px solid rgba(124, 140, 255, 0.35);
      border-radius: 16px;
      background: rgba(124, 140, 255, 0.12);
    }
    svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 620; }
    p { margin: 0 0 18px; color: #8e96bd; font-size: 13.5px; }
    button {
      padding: 10px 18px;
      color: #0a0c16;
      font: inherit;
      font-weight: 600;
      font-size: 13.5px;
      background: linear-gradient(180deg, #93a0ff, #7c8cff);
      border: 0;
      border-radius: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M2 8.5a14 14 0 0 1 20 0M5 12a9.5 9.5 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0" /><circle cx="12" cy="19" r="1.2" /></svg>
    </div>
    <h1>No connection</h1>
    <p>
      Apex Search is cached on this device, but results come from your SearXNG
      instance and need a network. Your search history is still here.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
